<!DOCTYPE html>
<html lang="${lang}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${title}</title>
<meta name="description" content="${description}">
<link rel="canonical" href="${canonical}">
<link rel="alternate" hreflang="${lang}" href="${canonical}">
<link rel="alternate" hreflang="x-default" href="${xdefault}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="${brand}">
<meta property="og:title" content="${title}">
<meta property="og:description" content="${description}">
<meta property="og:url" content="${canonical}">
<meta property="og:image" content="${og_image}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="${title}">
<meta name="twitter:description" content="${description}">
<meta name="twitter:image" content="${og_image}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b5fff'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='17' font-weight='bold' fill='white' text-anchor='middle'%3E${initial}%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f6f8fc;--card:#ffffff;--text:#101828;--muted:#5b6478;--line:#e3e8f0;--accent:#0b5fff;--accent-soft:#eaf0ff;--good:#0a7f45;--warn:#9a5b00;--bad:#a8322c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{background:#fff;border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:18px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--text)}
.logo span{color:var(--accent)}
nav.top a{margin-right:16px;color:var(--muted);font-size:15px}
nav.top a:hover{color:var(--accent)}
main{padding:32px 0 48px}
h1{font-size:32px;line-height:1.25;margin:0 0 12px;letter-spacing:-.02em}
h2{font-size:22px;margin:32px 0 14px;letter-spacing:-.01em}
h3{font-size:17px;margin:0 0 6px}
p.lead{font-size:18px;color:var(--muted);margin:0 0 8px}
small.muted{color:var(--muted)}
.hero{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px}
.card .prov{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.price{font-size:26px;font-weight:800;letter-spacing:-.02em}
.price small{font-size:14px;font-weight:600;color:var(--muted)}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.tag.grey{background:#eef1f6;color:var(--muted)}
.tag.warn{background:#fdf1de;color:var(--warn)}
.cta{display:inline-block;background:var(--accent);color:#fff;border-radius:9px;padding:10px 16px;font-weight:700;font-size:15px;margin-top:auto}
.cta:hover{background:#0a4ed0;text-decoration:none}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:15px}
th,td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f2f5fb;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
tr:last-child td{border-bottom:none}
.faq details{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:10px}
.faq summary{cursor:pointer;font-weight:700}
.faq p{margin:10px 0 0;color:var(--muted)}
.src{font-size:13px;color:var(--muted);word-break:break-all}
footer{border-top:1px solid var(--line);background:#fff;padding:26px 0 40px;color:var(--muted);font-size:14px}
.breadcrumb{font-size:13px;color:var(--muted);margin-bottom:12px}
.breadcrumb a{color:var(--muted)}
.kv{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.badge{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
@media(max-width:640px){h1{font-size:26px}.hero{padding:18px}}
</style>
${jsonld}
</head>
<body>
<header class="top"><div class="wrap">
<a class="logo" href="/">${brand}<span>.deal</span></a>
<nav class="top"><a href="/">Deals</a><a href="/compare">Compare</a></nav>
</div></header>
<main><div class="wrap">
${content}
</div></main>
<footer><div class="wrap">
<p><strong>${brand}</strong> — ${niche}. ${footer_note}</p>
<p>Data refreshed: <time datetime="${generated_at}">${generated_at}</time>. Every listing links back to the provider page it was read from.</p>
<p>${repo_line} Site rules are described with the <a href="https://ilang.ai" rel="noopener">I-Lang</a> protocol: <code>.ilang/site.ilang</code>.</p>
</div></footer>
</body>
</html>
